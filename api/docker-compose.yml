services:
  postgres:
    image: postgres:16-alpine
    container_name: car-finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: car_finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    volumes:
      - car-finance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d car_finance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  car-finance-postgres-data:
